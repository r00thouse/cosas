# Production: app only. TLS terminates at the operator's nginx.
# For local development use ./dev.sh instead: it runs node directly, no image build.
services:
  app:
    build: .
    image: hacklab-cosas:1.0
    # compose project dir = this directory (the app reads no files outside it)
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      DB_PATH: /data/cosas.db
      PHOTO_DIR: /photos
      TRUST_PROXY: "1"
    # Two host directories on purpose (both bind mounts, never named volumes): the
    # database and the image files can then be backed up by different means. They are
    # relative to this directory so that copying the repo copies every byte the app
    # needs. Both must be writable by uid 1000 (the image's `node` user).
    volumes: !override
      - ${DB_DIR:-./data}:/data
      - ${PHOTO_DIR:-./photos}:/photos
    # published only on loopback in prod; the dev overlay REPLACES this list with
    # ["8080:8080"] (Compose appends ports across files unless overridden with !reset)
    ports: !override
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
