# Production: app only. TLS terminates at the operator's nginx.
# For local development use ./dev.sh instead: it runs node directly, no image build.
#
# Every value below with a ${...} default is a knob in .env: the .env file is read for
# interpolation (and by env_file for the rest), so it wins over the defaults here.
# Values without ${...} are fixed facts of the image and cannot be overridden there.
services:
  app:
    build: .
    image: hacklab-cosas:1.0
    # compose project dir = this directory (the app reads no files outside it)
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: ${DB_PATH:-/data/cosas.db}
      PHOTO_DIR: ${PHOTO_DIR:-/photos}
      TRUST_PROXY: "${TRUST_PROXY:-1}"
    # Two host directories on purpose (both bind mounts, never named volumes): the
    # database and the image files can then be backed up by different means. They are
    # relative to this directory so that copying the repo copies every byte the app
    # needs. Both must be writable by uid 1000 (the image's `node` user).
    volumes: !override
      - ${DB_DIR:-./data}:/data
      - ${PHOTO_HOST_DIR:-./photos}:/photos
    # Loopback only in prod: nginx is the only client. Change PORT in .env and the
    # published port follows.
    ports: !override
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-8080}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
